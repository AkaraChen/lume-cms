name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:package
      - run: pnpm size
      - run: pnpm --filter lume-cms-example build
      - run: node scripts/scan-client.mjs examples UNPUBLISHED_TITLE_KIT_614 UNPUBLISHED_BODY_SENTINEL_KIT_614 UNPUBLISHED_BLOG_TITLE_KIT_618 UNPUBLISHED_BLOG_BODY_SENTINEL_KIT_618
      - run: pnpm --filter lume-cms-example test:routes
